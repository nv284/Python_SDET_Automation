<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locator Practice Page</title>

    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }

        .input-box {
            margin: 10px 0;
        }

        .login-btn {
            background-color: green;
            color: white;
            padding: 10px;
            border: none;
        }

        .error-msg {
            color: red;
        }

        .success-msg {
            color: green;
        }

        table {
            border-collapse: collapse;
            width: 60%;
        }

        table,
        th,
        td {
            border: 1px solid black;
            padding: 10px;
        }
    </style>

</head>

<body>

    <h1 id="main-title">Selenium Locator Practice</h1>

    <!-- Login Form -->
    <form id="login-form">

        <div class="input-box">
            <label>Email</label>
            <input type="text" id="email" name="user_email" placeholder="Enter Email">
        </div>

        <div class="input-box">
            <label>Password</label>
            <input type="password" id="pwd_123" name="password" placeholder="Enter Password">
        </div>

        <button id="login-btn" class="login-btn btn-primary">
            Login
        </button>

    </form>

    <p class="success-msg">
        Login Successful
    </p>

    <p class="error-msg">
        Invalid Password
    </p>

    <!-- Links -->
    <a href="https://google.com">Google Search</a>
    <br><br>

    <a href="https://youtube.com">
        Watch Videos
    </a>

    <br><br>

    <!-- Images -->
    <img src="image1.jpg" alt="Image1">
    <img src="image2.jpg" alt="Image2">

    <br><br>

    <!-- Dynamic Elements -->
    <input type="text" id="user_98765">
    <button class="btn-save-dynamic">
        Save Data
    </button>

    <br><br>

    <!-- Table -->
    <table>

        <tr>
            <th>Name</th>
            <th>Status</th>
            <th>Action</th>
        </tr>

        <tr>
            <td>John</td>
            <td>Active</td>
            <td>
                <button>Edit</button>
            </td>
        </tr>

        <tr>
            <td>David</td>
            <td>Inactive</td>
            <td>
                <button>Delete</button>
            </td>
        </tr>

    </table>

    <br><br>

    <!-- Checkbox -->
    <input type="checkbox" id="remember">
    <label for="remember">
        Remember Me
    </label>

</body>

</html>
